<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prévia da Imagem</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      padding: 20px;
      text-align: center;
    }

    .preview-container {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      background-color: #eef;
    }

    .preview-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-download {
      background-color: #007bff;
      color: #ffffff;
    }

    .btn-download:hover {
      background-color: #0056b3;
    }

    .btn-redirect {
      background-color: #e9ecef;
      color: #333333;
    }

    .btn-redirect:hover {
      background-color: #ced4da;
    }
  </style>
</head>
<body>

<div class="preview-container">
  <img src="plano de fundo.jpg.jpeg" alt="Prévia do Papel de Parede">
</div>

<div class="button-group">
  <!-- O botão de Download (o atributo 'download' força o baixar do arquivo) -->
  <a href="plano de fundo.jpg.jpeg" download="plano de fundo.jpg.jpeg" class="btn btn-download">
    Baixar Imagem
  </a>

  <!-- O botão para redirecionar para a outra página/site -->
  <a href="https://apoia.se/artes-natsumi" class="btn btn-redirect">
    Assinar carta / Acessar página
  </a>
</div>

</body>
</html>
